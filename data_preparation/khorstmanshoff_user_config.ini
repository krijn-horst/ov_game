# ============================================
# Configuratie voor khorstmanshoff - OV Game project (Linux)
# Pas de waarden hieronder aan naar jouw eigen lokale setup
# Let op: geen spaties rond het '=' teken, en geen aanhalingstekens om waarden
# ============================================

# --- PostgreSQL / PostGIS connectie ---
DB_HOST=localhost
DB_PORT=5432
DB_NAME=ov_game

# Superuser, alleen gebruikt om de database/rol eenmalig aan te maken (01_create_database)
PG_SUPERUSER=postgres
PG_SUPERUSER_PASSWORD=postgres

# Eigen applicatie-gebruiker, wordt gebruikt om data te laden (02_load_input_data)
DB_USER=khorstmanshoff
DB_PASSWORD=db_ovgame

# --- Installatiepaden ---
PGBIN=/usr/bin

# ogr2ogr locatie, nodig om CBS GeoPackage-data te laden
GDAL_BIN=/usr/bin
